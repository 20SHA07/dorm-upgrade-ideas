services:
  - type: web
    name: dorm-upgrade-ideas
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: dorm-reviews
      mountPath: /opt/render/project/src/data
      sizeGB: 1
